<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcement</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getFirestore, doc, collection, query, orderBy, limit,
  onSnapshot, addDoc, updateDoc, increment,
  getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyD9Fm_uadnK2k0FMp35j_wbvY9vO3slHx8",
  authDomain: "trustdollar-b632c.firebaseapp.com",
  projectId: "trustdollar-b632c",
  storageBucket: "trustdollar-b632c.appspot.com",
  messagingSenderId: "859933758308",
  appId: "1:859933758308:web:995733db2cc90cbab8e071"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const postRef = doc(db,"posts","announcement");
const commentsRef = collection(postRef,"comments");

const format = n =>
  n>=1e6 ? (n/1e6).toFixed(1)+"M" :
  n>=1e3 ? (n/1e3).toFixed(1)+"K" : n;

const snap = await getDoc(postRef);
if(!snap.exists()){
  await setDoc(postRef,{
    views:345000,
    likes:12900,
    shares:56000,
    commentsCount:12000
  });
}

onSnapshot(postRef,s=>{
  const d=s.data();
  views.innerText=format(d.views);
  likes.innerText=format(d.likes);
  shares.innerText=format(d.shares);
  cCount.innerText=format(d.commentsCount);
});

const q=query(commentsRef,orderBy("time","desc"),limit(100));
onSnapshot(q,snap=>{
  comments.innerHTML="";
  snap.forEach(d=>{
    const c=d.data();
    comments.innerHTML+=`
      <div class="comment">
        <div class="avatar">${c.name[0]}</div>
        <div>
          <b>${c.name}</b>
          <p>${c.text}</p>
        </div>
      </div>`;
  });
});

if(!sessionStorage.getItem("viewed")){
  updateDoc(postRef,{views:increment(1)});
  sessionStorage.setItem("viewed","1");
}

likeBtn.onclick=()=>{
  if(localStorage.getItem("liked_post")) return alert("Already liked ❤️");
  updateDoc(postRef,{likes:increment(1)});
  localStorage.setItem("liked_post","1");
  likeBtn.innerText="❤️ Liked";
  likeBtn.disabled=true;
};

shareBtn.onclick=async()=>{
  updateDoc(postRef,{shares:increment(1)});
  try{
    await navigator.share({title:"Update",url:location.href});
  }catch{
    await navigator.clipboard.writeText(location.href);
    alert("Link copied 👍");
  }
};

sendBtn.onclick=async()=>{
  if(!nameInp.value||!cmt.value) return alert("Fill both fields");
  await addDoc(commentsRef,{
    name:nameInp.value,
    text:cmt.value,
    time:Date.now()
  });
  await updateDoc(postRef,{commentsCount:increment(1)});
  cmt.value="";
};
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f4f6;
  font-family:system-ui;
  display:flex;
  justify-content:center;
  padding:10px;
}
.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 35px rgba(0,0,0,.08);
}
.card img{
  width:100%;
  height:auto;
  max-height:220px;
  object-fit:cover;
}
.header,.stats,.actions,.add-comment{padding:12px}
.stats{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  font-size:14px;
}
.actions{
  display:flex;
  gap:10px;
}
.actions button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#0284c7;
  color:#fff;
  font-weight:600;
}
.comments-box{
  max-height:240px;
  overflow-y:auto;
  padding:12px;
  border-top:1px solid #e5e7eb;
}
.comment{
  display:flex;
  gap:10px;
  margin-bottom:12px;
}
.avatar{
  width:34px;height:34px;
  background:#0284c7;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}
.add-comment{
  display:flex;
  flex-direction:column;
  gap:8px;
  border-top:1px solid #e5e7eb;
}
.add-comment input, .add-comment button{
  padding:10px;
  border-radius:8px;
  border:1px solid #d1d5db;
}
.add-comment button{
  background:#0284c7;
  color:#fff;
  border:none;
}

/* 🔍 Full Image Popup */
.img-viewer{
  position:fixed;
  top:0; left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
.img-viewer img{
  max-width:95%;
  max-height:95%;
  border-radius:10px;
}

/* 👆 Tap Image Hint Animation */
.tap-hint{
  margin-top:6px;
  font-size:13px;
  font-weight:600;
  color:#0284c7;
  text-align:center;
  animation:pulseHint 1.6s infinite;
}

@keyframes pulseHint{
  0%{
    opacity:0.3;
    transform:scale(0.95);
  }
  50%{
    opacity:1;
    transform:scale(1);
  }
  100%{
    opacity:0.3;
    transform:scale(0.95);
  }
}

</style>
</head>

<body>
  <!-- 🔍 Full Image Viewer -->
<div id="imgViewer" class="img-viewer" onclick="closeImage()">
  <img id="fullImg">
</div>

<div class="card">
<img src="photo/photogsaiashksajhsajsss.jpeg" onclick="openImage(this.src)">

<div class="header">
  <b>Official Update</b>
  <p>Verified daily system announcements.</p>

  <div class="tap-hint">
    👆 Tap image for full view
  </div>
</div>

  <div class="stats">
    👁️ <b id="views"></b>
    👍 <b id="likes"></b>
    🔁 <b id="shares"></b>
    💬 <b id="cCount"></b>
  </div>

  <div class="actions">
    <button id="likeBtn">👍 Like</button>
    <button id="shareBtn">🔁 Share</button>
  </div>

  <div class="comments-box" id="comments"></div>

  <div class="add-comment">
    <input id="nameInp" placeholder="Your name">
    <input id="cmt" placeholder="Write comment">
    <button id="sendBtn">Send</button>
  </div>
</div>
</body>
<script>
function openImage(src){
  document.getElementById("fullImg").src = src;
  document.getElementById("imgViewer").style.display = "flex";
}
function closeImage(){
  document.getElementById("imgViewer").style.display = "none";
}
</script>

</html>
